<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renk Değiştirici Website</title>
    <style>
        /* Sayfa düzeni ve yumuşak renk geçişi (animation) */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.4s ease; /* Renk değişirken yumuşak geçiş sağlar */
            background-color: #ffffff; /* Varsayılan arka plan renk */
        }

        /* Butonların durduğu kutu */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Buton stilleri */
        button {
            padding: 12px 24px;
            margin: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05); /* Fareyle üzerine gelince biraz büyür */
        }

        /* Buton renkleri */
        .btn-kirmizi { background-color: #e74c3c; }
        .btn-mavi { background-color: #3498db; }
        .btn-yesil { background-color: #2ecc71; }
        .btn-sari { background-color: #f1c40f; color: #333; }
        .btn-mor { background-color: #9b59b6; }
        .btn-sifirla { background-color: #34495e; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bir Renk Seçin</h1>
        <!-- Butonlara tıklandığında renkDegistir() fonksiyonu çalışır -->
        <button class="btn-kirmizi" onclick="renkDegistir('#e74c3c')">Kırmızı</button>
        <button class="btn-mavi" onclick="renkDegistir('#3498db')">Mavi</button>
        <button class="btn-yesil" onclick="renkDegistir('#2ecc71')">Yeşil</button>
        <button class="btn-sari" onclick="renkDegistir('#f1c40f')">Sarı</button>
        <button class="btn-mor" onclick="renkDegistir('#9b59b6')">Mor</button>
        <button class="btn-sifirla" onclick="renkDegistir('#ffffff')">Sıfırla</button>
    </div>

    <!-- JavaScript Kodları -->
    <script>
        function renkDegistir(renkKodu) {
            // Sayfanın (body) arka plan rengini gelen renk koduyla değiştirir
            document.body.style.backgroundColor = renkKodu;
        }
    </script>

</body>
</html>

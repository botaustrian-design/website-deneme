<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çok Renkli Website</title>
    <style>
        body { display: grid; place-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; transition: 0.4s; background: #ffffff; }
        .container { text-align: center; background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-width: 500px; }
        .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.2s; }
        button:hover { transform: scale(1.08); }
        .picker-box { margin-top: 20px; font-size: 14px; font-weight: bold; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: none; }
    </style>
</head>
<body>

    <div class="container" onclick="if(event.target.dataset.color) document.body.style.backgroundColor = event.target.dataset.color">
        <h1>Bir Renk Seçin</h1>
        
        <!-- Hazır Renk Butonları -->
        <div class="buttons">
            <button data-color="#e74c3c" style="background:#e74c3c">Kırmızı</button>
            <button data-color="#e67e22" style="background:#e67e22">Turuncu</button>
            <button data-color="#f1c40f" style="background:#f1c40f; color:#333">Sarı</button>
            <button data-color="#2ecc71" style="background:#2ecc71">Yeşil</button>
            <button data-color="#1abc9c" style="background:#1abc9c">Turkuaz</button>
            <button data-color="#3498db" style="background:#3498db">Mavi</button>
            <button data-color="#9b59b6" style="background:#9b59b6">Mor</button>
            <button data-color="#e84393" style="background:#e84393">Pembe</button>
            <button data-color="#2d3436" style="background:#2d3436">Siyah</button>
            <button data-color="#ffffff" style="background:#7f8c8d">Sıfırla</button>
        </div>

        <!-- Sınırsız Özel Renk Seçici -->
        <div class="picker-box">
            <label for="picker">Veya İstediğin Rengi Seç:</label>
            <input type="color" id="picker" oninput="document.body.style.backgroundColor = this.value">
        </div>
    </div>

</body>
</html>
